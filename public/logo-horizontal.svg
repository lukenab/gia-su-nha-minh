<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Gia Sư Nhà Mình</title>
  <desc id="logo-desc">Logo nguyên bản được sắp xếp lại theo chiều ngang</desc>

  <rect width="840" height="250" fill="#fff"/>

  <!-- Biểu tượng: sử dụng nguyên vùng ảnh từ PNG gốc -->
  <svg x="10" y="8" width="280" height="235" viewBox="280 130 720 605" preserveAspectRatio="xMidYMid meet">
    <image href="logo-original.png" x="0" y="0" width="1280" height="1280"/>
  </svg>

  <!-- Wordmark hai dòng: giữ nguyên toàn bộ vùng chữ từ PNG gốc -->
  <svg x="310" y="14" width="520" height="222" viewBox="220 725 880 375" preserveAspectRatio="xMidYMid meet">
    <image href="logo-original.png" x="0" y="0" width="1280" height="1280"/>
  </svg>
</svg>
